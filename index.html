  </div>

  <!-- NAVBAR -->
  <nav class="bg-black sticky top-0 z-50 border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div>
          <a href="index.html" class="flex items-center gap-2 text-3xl font-bold">
            <span class="red-accent">Tube</span><span class="text-white">Tap</span>
          </a>
          <p class="text-white-500 text-sm font-bold tracking-widest pl-1">Best Porn 18+</p>
        </div>
       
        <div class="flex-1 max-w-2xl mx-6">
          <div class="relative">
            <input type="text" placeholder="Search videos..." class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-600 rounded-full py-3 px-6 pl-12">
            <i class="fa-solid fa-magnifying-glass absolute left-5 top-3.5 text-zinc-500"></i>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 320x50 MOBILE TOP BANNER -->

  <div class="max-w-7xl mx-auto my-4 px-4 hidden md:block">

    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-8">

    <!-- 320x100 (Agar chaho toh yeh bhi add kar sakte hain, abhi chhoda hai) -->

          <a href="dmca.html" class="hover:text-white">DMCA</a>
          <a href="2257.html" class="hover:text-white">2257 Compliance</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const videos = [ /* tumhara pura videos array yahin paste kar do */ ];

    function createVideoCard(video, index) {
      let html = `
        <a href="video.html?id=${video.id}" class="block group">
          <div class="relative rounded-2xl overflow-hidden bg-zinc-900 card-hover">
            <img src="${video.thumb}" alt="${video.title}" class="w-full aspect-video object-cover">
            <div class="absolute bottom-2 right-2 bg-black/80 text-xs px-2 py-1 rounded font-mono">${video.duration}</div>
            <div class="absolute top-2 right-2 bg-red-600 text-xs px-2 py-0.5 rounded">HD</div>
          </div>
          <div class="mt-3 px-1">
            <h3 class="font-semibold line-clamp-2 group-hover:text-red-500">${video.title}</h3>
            <p class="text-zinc-500 text-sm mt-1">${video.uploader} • ${video.views} views • ${video.uploaded}</p>
          </div>
        </a>
      `;

      // Har 4th video ke baad 300x250 Ad
      if ((index + 1) % 4 === 0) {
        html += `
          <div class="col-span-full my-6">
            <div class="ad-container p-3">
              <p class="text-red-500 text-xs text-center mb-3 font-bold tracking-widest">SPONSORED</p>
              <img src="PUT_YOUR_300x250_IMAGE_LINK_HERE.jpg" alt="Sponsored Ad" class="w-full rounded-xl">
            </div>
          </div>
        `;
      }
      return html;
    }

    document.getElementById('video-grid').innerHTML = videos.map((video, i) => createVideoCard(video, i)).join('');

    // Age Gate Code (same as before)
    if (!localStorage.getItem('ageVerified')) {
      document.getElementById('age-gate').classList.remove('hidden');
    }
    window.enterSite = () => {
      localStorage.setItem('ageVerified', 'true');
      document.getElementById('age-gate').classList.add('hidden');
    };
    window.exitSite = () => window.location.href = "https://google.com";
  </script>
